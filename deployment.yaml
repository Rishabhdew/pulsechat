apiVersion: apps/v1
kind: Deployment

metadata:
  name: pulsechat

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pulsechat

  template:
    metadata:
      labels:
        app: pulsechat

    spec:
      containers:
        - name: pulsechat
          image: rish9981/pulsechat:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 3