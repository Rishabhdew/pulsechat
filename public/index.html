<!DOCTYPE html>
<html>
<head>
  <title>PulseChat 🚀</title>

  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  height: 100vh;
  background:
    linear-gradient(rgba(10,15,30,0.75), rgba(10,15,30,0.85)),
    url("/bg.png") no-repeat center center;
  background-size: cover;
  overflow: hidden;
}

#auth {
  display: flex;
  height: 100vh;
}

.left {
  flex: 1;
  position: relative;
}

.overlay {
  position: absolute;
  bottom: 50px;
  left: 50px;
  color: white;
}

.overlay h1 {
  font-size: 42px;
}

.overlay p {
  margin-top: 10px;
  opacity: 0.8;
}

.right {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(15px);
  background: rgba(15,23,42,0.6);
}

.form {
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.form h2 {
  text-align: center;
  color: white;
}

input {
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: #1e293b;
  color: white;
}

button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg,#6366f1,#4f46e5);
  color: white;
  cursor: pointer;
}

#app {
  display: none;
  height: 100vh;
  color: white;
}

.sidebar {
  width: 280px;
  padding: 20px;
  background: rgba(15,23,42,0.8);
  overflow-y: auto;
}

.conversation {
  padding: 12px;
  margin: 8px 0;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  cursor: pointer;
}

.conversation:hover {
  background: rgba(255,255,255,0.1);
}

.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 15px;
  display: flex;
  justify-content: space-between;
  background: rgba(15,23,42,0.7);
}

.logout {
  background: red;
}

.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  padding: 10px;
  border-radius: 12px;
  max-width: 60%;
}

.me {
  align-self: flex-end;
  background: #6366f1;
}

.other {
  align-self: flex-start;
  background: rgba(255,255,255,0.1);
}

.input {
  display: flex;
  gap: 10px;
  padding: 10px;
}

.input input {
  flex: 1;
}
  </style>
</head>

<body>

<!-- AUTH -->
<div id="auth">

  <div class="left">
    <div class="overlay">
      <h1>PulseChat 🚀</h1>
      <p>Persistent Real-Time Messaging</p>
    </div>
  </div>

  <div class="right">
    <div class="form">

      <h2>Login / Signup</h2>

      <input id="username" placeholder="Username">
      <input id="password" type="password" placeholder="Password">

      <button onclick="login()">Login</button>
      <button onclick="signup()">Signup</button>

    </div>
  </div>

</div>

<!-- CHAT APP -->
<div id="app">

  <div class="sidebar">

    <h3>Chats</h3>
    <button onclick="createGroup()"
style="
width:100%;
padding:10px;
margin-bottom:10px;
background:#6c5ce7;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
">
+ Create Group
</button>
    <div id="conversations"></div>
    <hr style="margin:15px 0; opacity:0.3;">

<h3>📩 Requests</h3>

<div id="requests"></div>

  </div>

  <div class="chat-area">

    <div class="header">

      <h3 id="chatWith">Select Chat</h3>
      <button onclick="summarizeChat()">
  ✨ Summarize
</button>
      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

    <div class="messages" id="messages"></div>

    <div class="input">

<button onclick="toggleEmojiPicker()">
😀
</button>

<input id="msgInput" placeholder="Type message...">
<input
  type="file"
  id="imageInput"
  accept="image/*"
  style="display:none"
  onchange="uploadImage()"
/>

<button onclick="
document.getElementById('imageInput').click()
">
📷
</button>
<button onclick="startRecording()">
🎤
</button>

<button onclick="sendMessage()">
  Send
</button>

    </div>
<div id="emojiPicker" style="
display:none;
padding:10px;
background:rgba(0,0,0,0.3);
border-radius:10px;
margin:10px;
">

<span onclick="addEmoji('😀')">😀</span>
<span onclick="addEmoji('😂')">😂</span>
<span onclick="addEmoji('❤️')">❤️</span>
<span onclick="addEmoji('🔥')">🔥</span>
<span onclick="addEmoji('👍')">👍</span>
<span onclick="addEmoji('😭')">😭</span>
<span onclick="addEmoji('😎')">😎</span>
<span onclick="addEmoji('🎉')">🎉</span>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let username = "";
let currentUser = null;

let selectedConversation = null;

let conversations = [];
let unreadMessages = {};
let onlineUsers = [];
let mediaRecorder;
let documentMessages = [];
let audioChunks = [];
/* ================= LOGIN ================= */

async function login() {

  const usernameInput =
    document.getElementById("username").value;

  const passwordInput =
    document.getElementById("password").value;

  const res = await fetch("/api/auth/login", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      username: usernameInput,
      password: passwordInput
    })

  });

  const data = await res.json();

  if (data.error) {

    alert(data.error);
    return;

  }

  username = usernameInput;

  currentUser = data.user;

  document.getElementById("auth").style.display = "none";

  document.getElementById("app").style.display = "flex";

  socket.emit("join", username);

  loadConversations();
  loadRequests();
  setInterval(() => {

  loadRequests();

}, 3000);

}

/* ================= SIGNUP ================= */

async function signup() {

  const usernameInput =
    document.getElementById("username").value;

  const passwordInput =
    document.getElementById("password").value;

  const res = await fetch("/api/auth/signup", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      username: usernameInput,
      password: passwordInput
    })

  });

  const data = await res.json();

  if (data.error) {

    alert(data.error);
    return;

  }

  alert("Signup successful!");

}

/* ================= LOGOUT ================= */

function logout() {

  location.reload();

}

/* ================= LOAD CONVERSATIONS ================= */

async function loadConversations() {

  const res = await fetch(
    `/api/conversations/${username}`
  );

  conversations = await res.json();

  renderConversations();

}

/* ================= RENDER CONVERSATIONS ================= */

function renderConversations() {

  const box =
    document.getElementById("conversations");

  box.innerHTML = "";

  conversations.forEach(conv => {

    const div = document.createElement("div");

    div.className = "conversation";

    let title = "";

    if (conv.type === "group") {

      title = "👥 " + conv.groupName;

    } else {

      const otherUser =
        conv.participants.find(
          p => p.username !== username
        );

      title = otherUser?.username || "Unknown";

    }

const unread =
  unreadMessages[conv._id] || 0;

div.innerHTML = `
  <strong>${title}</strong>
  ${
    unread > 0
    ? `<span style="
        background:red;
        color:white;
        border-radius:50%;
        padding:4px 8px;
        font-size:12px;
        float:right;
      ">
        ${unread}
      </span>`
    : ""
  }
  <br>
  <small>${conv.lastMessage || ""}</small>
`;
    div.onclick = () => {

      openConversation(conv);

    };

    box.appendChild(div);

  });

}
/* ================= LOAD REQUESTS =================== */

async function loadRequests() {

  const res = await fetch(
    `/api/request/${currentUser._id}`
  );

  const requests =
    await res.json();

  renderRequests(requests);

}



/* ================= RENDER REQUESTS ================= */

function renderRequests(requests) {

  const box =
    document.getElementById("requests");

  box.innerHTML = "";

  requests.forEach(req => {

    const div =
      document.createElement("div");

    div.className =
      "conversation";

    div.innerHTML = `
      <strong>
        ${req.sender.username}
      </strong>

      <br><br>

      <button
        onclick="acceptRequest('${req._id}')"
      >
        Accept
      </button>
    `;

    box.appendChild(div);

  });

}



/* ================= ACCEPT REQUEST ================= */

async function acceptRequest(
  requestId
) {

  try {

    await fetch(
      `/api/request/accept/${requestId}`,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          requestId
        })

      }
    );

    alert(
      "Request accepted!"
    );

    loadRequests();

    loadConversations();

  } catch (err) {

    console.log(err);

  }

}
/* ================= RENDER ONLINE USERS ================= */

function renderOnlineUsers() {

  let usersBox =
    document.getElementById("onlineUsers");

  // CREATE ONLY ONCE
  if (!usersBox) {

    const sidebar =
      document.querySelector(".sidebar");

    const hr =
      document.createElement("hr");

    hr.style.margin = "15px 0";
    hr.style.opacity = "0.3";

    const title =
      document.createElement("h3");

    title.innerText = "Online Users";

    usersBox =
      document.createElement("div");

    usersBox.id = "onlineUsers";

    sidebar.appendChild(hr);
    sidebar.appendChild(title);
    sidebar.appendChild(usersBox);

  }

  // CLEAR OLD USERS
  usersBox.innerHTML = "";

  onlineUsers.forEach(user => {

    if (user === username) return;

    const div =
      document.createElement("div");

    div.className = "conversation";

    div.innerHTML = `🟢 ${user}`;

    div.onclick = async () => {

  try {

    // CHECK EXISTING CONVERSATION
    const existing =
      conversations.find(conv => {

        if (conv.type === "group")
          return false;

        return conv.participants.some(
          p => p.username === user
        );

      });

    // OPEN DIRECTLY
    if (existing) {

      openConversation(existing);
      return;

    }

    // GET USERS
    console.log("clicked user");
    const res1 = await fetch(
      "/api/all-users"
    );

    const allUsers =
      await res1.json();

    const otherUser =
      allUsers.find(
        u => u.username === user
      );

    if (!otherUser) return;

    // SEND REQUEST
    console.log("sending request");
    const res2 = await fetch(
      "/api/request/send",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          sender:
            currentUser._id,

          receiver:
            otherUser._id

        })

      }
    );

    const data =
      await res2.json();

    alert(
      data.message ||
      "Chat request sent!"
    );

  } catch (err) {

    console.log(err);

    alert(
      "Request failed"
    );

  }

};

    usersBox.appendChild(div);

  });

}
/* ================= OPEN CHAT ================= */

async function openConversation(conv) {

  selectedConversation = conv;
  unreadMessages[conv._id] = 0;
  socket.emit(
    "join_conversation",
    conv._id
  );

  let title = "";

  if (conv.type === "group") {

    title = conv.groupName;

  } else {

    const otherUser =
      conv.participants.find(
        p => p.username !== username
      );

    title = otherUser?.username || "Unknown";

  }

  document.getElementById("chatWith")
    .innerText = title;

  const res = await fetch(
    `/api/messages/${conv._id}`
  );

 const msgs = await res.json();

documentMessages = msgs;

renderMessages(documentMessages);
}
async function summarizeChat() {

  if (!selectedConversation) {

    alert("Open a chat first");

    return;

  }

  const res = await fetch(
    `/api/summary/${selectedConversation._id}`
  );

  const data =
    await res.json();

  alert(
    "CHAT SUMMARY:\n\n" +
    data.summary
  );

}
/* ================= SEND MESSAGE ================= */

function sendMessage() {

  const input =
    document.getElementById("msgInput");

  const content = input.value;

  if (!content || !selectedConversation) {

    alert("Select a conversation");
    return;

  }

  socket.emit("send_message", {

    sender: currentUser._id,

    conversationId:
      selectedConversation._id,

    content

  });
  const newMsg = {

  sender: {
    _id: currentUser._id,
    username: username
  },

  content,

  conversationId:
    selectedConversation._id

};

documentMessages.push(newMsg);

renderMessages(documentMessages);
  input.value = "";

}

/* ================= RECEIVE MESSAGE ================= */

socket.on("receive_message", (msg) => {

  const currentConvId =
    selectedConversation?._id;

  if (
    !currentConvId ||
    msg.conversation !== currentConvId
  ) {

    unreadMessages[msg.conversation] =
      (unreadMessages[msg.conversation] || 0) + 1;

  }

  if (
    selectedConversation &&
    msg.conversation === selectedConversation._id
  ) {

    addMessage(msg);

  }

  loadConversations();

});
/* ================= ONLINE USERS ================= */

/* ================= ONLINE USERS ================= */

socket.on("users", (usersList) => {

  onlineUsers = usersList;

  renderOnlineUsers();

});


socket.on(
  "conversation_accepted",
  () => {

    loadConversations();

    loadRequests();

  }
);
/* ================= RENDER MESSAGES ================= */

function renderMessages(list) {

  const box =
    document.getElementById("messages");

  box.innerHTML = "";

  list.forEach(addMessage);

}

/* ================= ADD MESSAGE ================= */

function addMessage(msg) {

  const box =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  const isMe =
    msg.sender === currentUser._id ||
    msg.sender?._id === currentUser._id;

  div.className =
    "msg " + (isMe ? "me" : "other");

if (msg.messageType === "audio") {

  div.innerHTML = `
    <audio controls>
      <source
        src="${msg.mediaUrl}"
        type="audio/webm">
    </audio>
  `;

} else if (
  msg.messageType === "image"
) {

  div.innerHTML = `
    <img
      src="${msg.mediaUrl}"
      style="
        max-width:200px;
        border-radius:10px;
      "
    />
  `;

} else {

  div.innerText =
    msg.content;

}
  box.appendChild(div);

  box.scrollTop = box.scrollHeight;

}
function toggleEmojiPicker() {

  const picker =
    document.getElementById(
      "emojiPicker"
    );

  if (picker.style.display === "none") {

    picker.style.display = "block";

  } else {

    picker.style.display = "none";

  }

}

function addEmoji(emoji) {

  const input =
    document.getElementById(
      "msgInput"
    );

  input.value += emoji;

}

async function startRecording() {

  try {

    const stream =
      await navigator.mediaDevices
      .getUserMedia({
        audio: true
      });

    mediaRecorder =
      new MediaRecorder(stream);

    audioChunks = [];

    mediaRecorder.ondataavailable =
      event => {

      audioChunks.push(
        event.data
      );

    };

    mediaRecorder.onstop =
      async () => {

      const audioBlob =
        new Blob(
          audioChunks,
          {
            type: "audio/webm"
          }
        );

      const formData =
        new FormData();

      formData.append(
        "audio",
        audioBlob,
        "voice.webm"
      );

      formData.append(
        "sender",
        currentUser._id
      );

      formData.append(
        "conversationId",
        selectedConversation._id
      );

      await fetch(
        "/api/upload/audio",
        {

          method: "POST",

          body: formData

        }
      );

    };

    mediaRecorder.start();

    alert(
      "Recording started..."
    );

    setTimeout(() => {

      mediaRecorder.stop();

      alert(
        "Voice note sent!"
      );

    }, 5000);

  } catch (err) {

    console.log(err);

    alert(
      "Microphone access denied"
    );

  }

}
async function uploadImage() {

  try {

    const fileInput =
      document.getElementById(
        "imageInput"
      );

    const file =
      fileInput.files[0];

    if (!file) return;

    const formData =
      new FormData();

    formData.append(
      "image",
      file
    );

    formData.append(
      "sender",
      currentUser._id
    );

    formData.append(
      "conversationId",
      selectedConversation._id
    );

    await fetch(
      "/api/upload/image",
      {

        method: "POST",

        body: formData

      }
    );

    fileInput.value = "";

  } catch (err) {

    console.log(err);

    alert(
      "Image upload failed"
    );

  }

}
async function createGroup() {

  try {

    const groupName =
      prompt("Enter group name");

    if (!groupName) return;

    const usernames =
      prompt(
        "Enter usernames separated by comma"
      );

    if (!usernames) return;

    const names =
      usernames
      .split(",")
      .map(u => u.trim());

    // GET USERS
    const res =
      await fetch("/api/all-users");

    const allUsers =
      await res.json();

    const members =
      allUsers
      .filter(u =>
        names.includes(u.username)
      )
      .map(u => u._id);

    // CREATE GROUP
    const response =
      await fetch(
        "/api/group/create",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            groupName,

            creator:
              currentUser._id,

            members

          })

        }
      );

    const data =
      await response.json();

    console.log(data);

    alert("Group created!");

    loadConversations();

  } catch (err) {

    console.log(err);

    alert("Group creation failed");

  }

}
</script>
</body>
</html>
