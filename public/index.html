<!DOCTYPE html>
<html>
<head>
  <title>PulseChat 🚀</title>

  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

/* BACKGROUND */
body {
  height: 100vh;
  background:
    linear-gradient(rgba(10,15,30,0.75), rgba(10,15,30,0.85)),
    url("/bg.png") no-repeat center center;
  background-size: cover;
  overflow: hidden;
}

/* LOGIN */
#auth {
  display: flex;
  height: 100vh;
}

.left {
  flex: 1;
  position: relative;
}

.overlay {
  position: absolute;
  bottom: 50px;
  left: 50px;
  color: white;
}

.overlay h1 {
  font-size: 42px;
}

.overlay p {
  margin-top: 10px;
  opacity: 0.8;
}

.right {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(15px);
  background: rgba(15,23,42,0.6);
}

.form {
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.form h2 {
  text-align: center;
  color: white;
}

input {
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: #1e293b;
  color: white;
}

input::placeholder {
  color: #94a3b8;
}

button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg,#6366f1,#4f46e5);
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

/* CHAT */
#app {
  display: none;
  height: 100vh;
  color: white;
}

/* SIDEBAR */
.sidebar {
  width: 250px;
  padding: 20px;
  background: rgba(15,23,42,0.8);
  backdrop-filter: blur(12px);
}

.user {
  padding: 10px;
  margin: 5px 0;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  cursor: pointer;
}

.user:hover {
  background: rgba(255,255,255,0.1);
}

/* CHAT AREA */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  padding: 15px;
  display: flex;
  justify-content: space-between;
  background: rgba(15,23,42,0.7);
}

.logout {
  background: red;
}

/* MESSAGES */
.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  padding: 10px;
  border-radius: 12px;
  max-width: 60%;
}

.me {
  align-self: flex-end;
  background: #6366f1;
}

.other {
  align-self: flex-start;
  background: rgba(255,255,255,0.1);
}

/* INPUT */
.input {
  display: flex;
  gap: 10px;
  padding: 10px;
}

.input input {
  flex: 1;
}
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
  <div class="left">
    <div class="overlay">
      <h1>PulseChat 🚀</h1>
      <p>Connect. Chat. Build Memories.</p>
    </div>
  </div>

  <div class="right">
    <div class="form">
      <h2>Create / Login</h2>
      <input id="username" placeholder="Username">
      <input id="password" type="password" placeholder="Password">

      <button onclick="login()">Login</button>
      <button onclick="signup()">Signup</button>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="app">
  <div class="sidebar">
    <h3>Users</h3>
    <div id="users"></div>
  </div>

  <div class="chat-area">
    <div class="header">
      <h3 id="chatWith">Select user</h3>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input">
      <input id="msgInput" placeholder="Type message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="/socket.io/socket.io.js"></script>
<script>
console.log("SCRIPT LOADED");

const socket = io();

let username = "";
let selectedUser = "";

/* LOGIN */
async function login() {
  console.log("login clicked");

  const usernameInput = document.getElementById("username").value;
  const passwordInput = document.getElementById("password").value;

  const res = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: usernameInput, password: passwordInput })
  });

  const data = await res.json();
  console.log(data);

  if (data.error) {
    alert(data.error);
    return;
  }

  username = usernameInput;

  document.getElementById("auth").style.display = "none";
  document.getElementById("app").style.display = "flex";

  socket.emit("join", username);
}

/* SIGNUP */
async function signup() {
  console.log("signup clicked");

  const usernameInput = document.getElementById("username").value;
  const passwordInput = document.getElementById("password").value;

  const res = await fetch("/api/auth/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: usernameInput, password: passwordInput })
  });

  const data = await res.json();
  console.log(data);

  if (data.error) {
    alert(data.error);
    return;
  }

  alert("Signup successful! Now login.");
}

/* LOGOUT */
function logout() {
  location.reload();
}

/* USERS */
socket.on("users", (list) => {
  const div = document.getElementById("users");
  div.innerHTML = "";

  list.forEach(u => {
    if (u !== username) {
      const el = document.createElement("div");
      el.className = "user";
      el.innerText = u;

      el.onclick = async () => {
        selectedUser = u;
        document.getElementById("chatWith").innerText = "Chat with " + u;

        const res = await fetch(`/api/messages/${username}/${u}`);
        const msgs = await res.json();

        renderMessages(msgs);
      };

      div.appendChild(el);
    }
  });
});

/* SEND */
function sendMessage() {
  const text = document.getElementById("msgInput").value;

  if (!text || !selectedUser) {
    alert("Select a user first");
    return;
  }

  socket.emit("private_message", {
    sender: username,
    receiver: selectedUser,
    text
  });

  document.getElementById("msgInput").value = "";
}

/* RECEIVE */
socket.on("private_message", (msg) => {
  if (msg.sender === selectedUser || msg.receiver === selectedUser) {
    addMessage(msg);
  }
});

/* RENDER */
function renderMessages(list) {
  const box = document.getElementById("messages");
  box.innerHTML = "";
  list.forEach(addMessage);
}

/* ADD */
function addMessage(msg) {
  const box = document.getElementById("messages");

  const div = document.createElement("div");
  div.className = "msg " + (msg.sender === username ? "me" : "other");
  div.innerText = msg.text;

  box.appendChild(div);
}
</script>

</body>
</html>
